    const getInventoryStatus = (book) => {
      let level = "Medium Stock";
      if (book.stock_quantity === 0) level = "Out of Stock";
      else if (book.stock_quantity <= 2) level = "Low Stock";
      else if (book.stock_quantity >= 8) level = "High Stock";

      return {
        ...book,
        stock_level: level,
        needs_reorder: book.stock_quantity <= book.reorder_threshold
      };
    };

    function executeDatabaseTool(name, args) {
      console.log(`[Database Query Executed] Tool: ${name}`, args);
      
      switch(name) {
        case "advanced_book_search": {
          let results = RIVERSIDE_DATABASE.books.map(getInventoryStatus);

          if (args.genre && args.genre.trim()) {
            const searchGenre = args.genre.toLowerCase().trim();
            results = results.filter(b => b.genre.toLowerCase().includes(searchGenre));
          }

          if (args.query && args.query.trim()) {
            const q = args.query.toLowerCase().trim();
            results = results.filter(b => 
              b.title.toLowerCase().includes(q) || 
              b.author.toLowerCase().includes(q) || 
              b.genre.toLowerCase().includes(q)
            );
          }

          if (typeof args.max_price === 'number') {
            results = results.filter(b => b.price <= args.max_price);
          }
          if (typeof args.min_price === 'number') {
            results = results.filter(b => b.price >= args.min_price);
          }

          if (args.genre && args.genre.trim()) {
            const g = args.genre.toLowerCase();
            results = results.filter(b => b.genre.toLowerCase().includes(g));
          }

          if (typeof args.published_year === 'number') {
            results = results.filter(b => b.published_year === args.published_year);
          }

          if (typeof args.published_after === 'number') {
            results = results.filter(b => b.published_year >= args.published_after);
          }
          if (typeof args.published_before === 'number') {
            results = results.filter(b => b.published_year <= args.published_before);
          }

          if (args.stock_status) {
            if (args.stock_status === 'in_stock') results = results.filter(b => b.stock_quantity > 0);
            else if (args.stock_status === 'low_stock') results = results.filter(b => b.stock_quantity > 0 && b.stock_quantity <= 2);
            else if (args.stock_status === 'out_of_stock') results = results.filter(b => b.stock_quantity === 0);
          }

          if (args.sort_by) {
            if (args.sort_by === 'price_asc') results.sort((a,b) => a.price - b.price);
            else if (args.sort_by === 'price_desc') results.sort((a,b) => b.price - a.price);
            else if (args.sort_by === 'year_desc') results.sort((a,b) => b.published_year - a.published_year);
            else if (args.sort_by === 'year_asc') results.sort((a,b) => b.published_year - a.published_year);
            else if (args.sort_by === 'stock_asc') results.sort((a,b) => b.stock_quantity - b.stock_quantity);
            else if (args.sort_by === 'title') results.sort((a,b) => a.title.localeCompare(b.title));
          }

          if (typeof args.limit === 'number' && args.limit > 0) {
            results = results.slice(0, args.limit);
          }

          return {
            criteria_applied: args,
            match_count: results.length,
            results: results
          };
        }

        case "relational_event_books": {
          const joinedEvents = RIVERSIDE_DATABASE.events.map(event => {
            const book = RIVERSIDE_DATABASE.books.find(b => b.id === event.related_book_id);
            return {
              ...event,
              book_details: book ? getInventoryStatus(book) : null
            };
          });
          return {
            joined_records: joinedEvents.length,
            events_with_inventory: joinedEvents
          };
        }

        case "search_books": {
          const q = (args.query || "").toLowerCase();
          const matches = RIVERSIDE_DATABASE.books
            .filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.genre.toLowerCase().includes(q))
            .map(getInventoryStatus);
            
          return {
            query: args.query,
            match_count: matches.length,
            results: matches
          };
        }

        case "get_store_hours": {
          return {
            store_name: RIVERSIDE_DATABASE.store_info.store_name,
            hours: RIVERSIDE_DATABASE.store_info.hours
          };
        }

        case "get_return_policy": {
          return {
            return_policy: RIVERSIDE_DATABASE.store_info.return_policy,
            exchange_policy: RIVERSIDE_DATABASE.store_info.exchange_policy
          };
        }

        case "get_rewards_info": {
          return {
            reward_rule: RIVERSIDE_DATABASE.store_info.reward_rule,
            birthday_discount_rule: RIVERSIDE_DATABASE.store_info.birthday_discount_rule
          };
        }

        case "get_available_genres": {
          return {
            genres: RIVERSIDE_DATABASE.store_info.available_genres
          };
        }

        case "get_upcoming_events": {
          const limit = args.limit || 5;
          return {
            total_events: RIVERSIDE_DATABASE.events.length,
            upcoming_events: RIVERSIDE_DATABASE.events.slice(0, limit)
          };
        }

        case "get_about_store": {
          return {
            store_name: RIVERSIDE_DATABASE.store_info.store_name,
            about_text: RIVERSIDE_DATABASE.store_info.about_text,
            address: RIVERSIDE_DATABASE.store_info.address,
            phone: RIVERSIDE_DATABASE.store_info.phone,
            email: RIVERSIDE_DATABASE.store_info.email
          };
        }

        case "search_merchandise": {
          const q = (args.query || "").toLowerCase();
          let items = RIVERSIDE_DATABASE.merchandise
            .filter(m => m.item_name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q));
          if (typeof args.max_price === 'number') {
            items = items.filter(m => m.price <= args.max_price);
          }
          return {
            query: args.query,
            results: items
          };
        }

        default:
          return { error: `Unknown tool name: ${name}` };
      }
    }

    function processLocalQuery(userInput) {
      const input = userInput.toLowerCase();
      let toolName = null;
      let toolArgs = {};

      if (input.includes("hours") || input.includes("open") || input.includes("close") || input.includes("time") || input.includes("when are you open")) {
        toolName = "get_store_hours";
      } else if (input.includes("return") || input.includes("exchange") || input.includes("policy") || input.includes("refund")) {
        toolName = "get_return_policy";
      } else if (input.includes("reward") || input.includes("point") || input.includes("birthday") || input.includes("membership") || input.includes("discount")) {
        toolName = "get_rewards_info";
      } else if (input.includes("genre") || input.includes("categories") || input.includes("what kinds of books") || input.includes("book types")) {
        toolName = "get_available_genres";
      } else if (input.includes("about") || input.includes("address") || input.includes("location") || input.includes("phone") || input.includes("email") || input.includes("where are you")) {
        toolName = "get_about_store";
      } else if (input.includes("event") && (input.includes("book") || input.includes("stock") || input.includes("inventory"))) {
        toolName = "relational_event_books";
      } else if ((input.includes("event") || input.includes("signing") || input.includes("club") || input.includes("workshop")) && !input.includes("book")) {
        toolName = "get_upcoming_events";
        toolArgs = { limit: 5 };
      } else if (input.includes("tote") || input.includes("mug") || input.includes("journal") || input.includes("bookmark")) {
        toolName = "search_merchandise";
        toolArgs = { query: input };
      } else {
        toolName = "advanced_book_search";

        const maxPriceMatch = input.match(/(?:under|below|less than|max|cheaper than|\$)\s*\$?(\d+(?:\.\d+)?)/i);
        const extractedMaxPrice = maxPriceMatch ? parseFloat(maxPriceMatch[1]) : undefined;

        const minPriceMatch = input.match(/(?:over|above|more than|min|at least)\s*\$?(\d+(?:\.\d+)?)/i);
        const extractedMinPrice = minPriceMatch ? parseFloat(minPriceMatch[1]) : undefined;

        const yearBeforeMatch = input.match(/(?:before|prior to|older than|earlier than|pre-?)\s*(\d{4})/i);
        let extractedYearBefore = yearBeforeMatch ? parseInt(yearBeforeMatch[1], 10) : undefined;

        const yearAfterMatch = input.match(/(?:after|since|newer than|post-?)\s*(\d{4})/i);
        let extractedYearAfter = yearAfterMatch ? parseInt(yearAfterMatch[1], 10) : undefined;

        const yearExactMatch = input.match(/(?:published in|in year|from year|year)\s*(\d{4})/i) || input.match(/\b(20\d{2}|19\d{2})\b/);
        let extractedYearExact = (!yearBeforeMatch && !yearAfterMatch && yearExactMatch) ? parseInt(yearExactMatch[1], 10) : undefined;

        let extractedStockStatus = undefined;
        if (input.includes("low stock") || input.includes("running low") || input.includes("reorder")) {
          extractedStockStatus = "low_stock";
        } else if (input.includes("out of stock") || input.includes("sold out") || input.includes("unavailable")) {
          extractedStockStatus = "out_of_stock";
        } else if (input.includes("in stock") || input.includes("available")) {
          extractedStockStatus = "in_stock";
        }

        let extractedGenre = undefined;
        const knownGenres = RIVERSIDE_DATABASE.store_info.available_genres;
        for (const g of knownGenres) {
          if (input.includes(g.toLowerCase())) {
            extractedGenre = g;
            break;
          }
        }
        if (!extractedGenre) {
          if (input.includes("fiction") && !input.includes("historical")) extractedGenre = "Literary Fiction";
          else if (input.includes("historical")) extractedGenre = "Historical Fiction";
          else if (input.includes("fantasy")) extractedGenre = "Fantasy";
          else if (input.includes("mystery") || input.includes("thriller")) extractedGenre = input.includes("mystery") ? "Mystery / Thriller" : "Thriller";
          else if (input.includes("cookbook") || input.includes("cooking") || input.includes("baking")) extractedGenre = "Cookbook";
          else if (input.includes("nature") || input.includes("science") || input.includes("flora")) extractedGenre = "Nature & Science";
          else if (input.includes("poetry")) extractedGenre = "Poetry";
          else if (input.includes("children") || input.includes("kids") || input.includes("ya")) extractedGenre = "Children's / YA";
          else if (input.includes("philosophy") || input.includes("self-help") || input.includes("mindful")) extractedGenre = "Philosophy & Self-Help";
        }

        let cleanQuery = input
          .replace(/(?:under|below|less than|max|cheaper than|over|above|more than|min|at least|\$)\s*\$?(\d+(?:\.\d+)?)/gi, '')
          .replace(/(?:before|prior to|older than|earlier than|after|since|newer than|published in|in year|from year|year|pre-?|post-?)\s*(\d{4})/gi, '')
          .replace(/\b(20\d{2}|19\d{2})\b/g, '')
          .replace(new RegExp(knownGenres.join('|'), 'gi'), '')
          .replace(/\b(do you have|can i find|show me|find|search|list|get|are there|any|books?|copies|published|year|price|cost|under|below|above|before|after|in|stock|low|out of|available|genre|category)\b/gi, '')
          .replace(/[^\w\s]/g, '')
          .trim();

        const finalQuery = (cleanQuery.length >= 2) ? cleanQuery : undefined;

        toolArgs = {
          query: finalQuery,
          genre: extractedGenre,
          max_price: extractedMaxPrice,

      async function callGeminiApi(userQuery, history) {
        const keyToUse = apiKey.trim();
        if (!keyToUse) {
          throw new Error("API key required for Gemini Flash mode.");
        }
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${keyToUse}`;

        const contents = history.map(msg => ({
          role: msg.sender === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        }));

        contents.push({ role: 'user', parts: [{ text: userQuery }] });

        const payload = {
          contents: contents,
          tools: [{ functionDeclarations: TOOL_DECLARATIONS }],
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
        };

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API returned status ${response.status}`);
        }

        const data = await response.json();
        const candidate = data.candidates?.[0];
        const part = candidate?.content?.parts?.[0];

        if (part && part.functionCall) {
          const toolCall = part.functionCall;
          const toolResult = executeDatabaseTool(toolCall.name, toolCall.args || {});

          setActiveToolInfo({
            name: toolCall.name,
            args: toolCall.args,
            result: toolResult
          });

          const followUpContents = [
            ...contents,
            candidate.content,
            {
              role: 'user',
              parts: [{
                functionResponse: {
                  name: toolCall.name,
                  response: { content: toolResult }
                }
              }]
            }
          ];

          const followUpResponse = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: followUpContents,
              systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
            })
          });

          const followUpData = await followUpResponse.json();
          const finalCandidate = followUpData.candidates?.[0];
          const finalPart = finalCandidate?.content?.parts?.[0];

          return {
            text: finalPart?.text || "Here is the information from our database.",
            toolCalled: { name: toolCall.name, args: toolCall.args, result: toolResult }
          };
        }

        return {
          text: part?.text || "I'm here to help with Riverside Books questions!",
          toolCalled: null
        };
      }

            <form
              onSubmit={(e) => {
                e.preventDefault();
                handleSendMessage();
              }}
              className="flex items-center gap-2"
            >
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="Ask anything (e.g., 'Find books published in the year 2021')"
                disabled={isLoading}
                className="flex-1 bg-parchment-50 border border-parchment-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-mahogany-600/50 focus:border-mahogany-600 text-ink-900 placeholder-parchment-400 disabled:opacity-50"
              />
              <button
                type="submit"
                disabled={isLoading || !input.trim()}
                className="bg-mahogany-700 hover:bg-mahogany-800 disabled:bg-parchment-300 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-sm disabled:cursor-not-allowed shrink-0"
              >
                <span>Send</span>
                <i className="fa-solid fa-paper-plane text-xs"></i>
              </button>
            </form>
            <div className="mt-2 text-center text-[11px] text-parchment-400 font-medium">
              Active Engine: {queryMode === 'gemini_flash' ? 'Google Gemini 1.5 Flash Tool Use' : 'SQLite Local Regex Simulator'}
            </div>
          </footer>

          {isExamplesModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 z-50 animate-fadeIn">
              <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-parchment-300 overflow-hidden">
                
                <div className="bg-mahogany-900 text-parchment-100 px-6 py-4 flex items-center justify-between border-b border-mahogany-700">
                  <div className="flex items-center gap-2.5">
                    <i className="fa-solid fa-list-check text-amber-400 text-lg"></i>
                    <div>
                      <h2 className="font-serif font-bold text-lg text-parchment-100">Comprehensive Search & Query Examples</h2>
                      <p className="text-xs text-parchment-300">Click any example below to instantly query the chatbot assistant!</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsExamplesModalOpen(false)}
                    className="text-parchment-300 hover:text-white p-1 rounded-lg transition"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-auto p-4 sm:p-6 bg-parchment-50 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {SEARCH_EXAMPLE_CATEGORIES.map((cat, idx) => (
                      <div key={idx} className="bg-white p-4 rounded-xl border border-parchment-300 shadow-2xs space-y-2.5">
                        <h3 className="font-serif font-bold text-xs uppercase tracking-wider text-mahogany-900 flex items-center gap-2 border-b border-parchment-200 pb-2">
                          <i className={`fa-solid ${cat.icon} text-amber-700 text-sm`}></i>
                          <span>{cat.category}</span>
                        </h3>
                        <div className="flex flex-col gap-1.5">
                          {cat.phrases.map((phrase, pIdx) => (
                            <button
                              key={pIdx}
                              onClick={() => handleSendMessage(phrase)}
                              disabled={isLoading}
                              className="text-left text-xs font-medium text-ink-800 hover:text-white hover:bg-mahogany-700 bg-parchment-50 p-2 rounded-lg transition flex items-center justify-between group disabled:opacity-50 border border-parchment-200/60"
                            >
                              <span className="pr-2">"{phrase}"</span>
                              <i className="fa-solid fa-arrow-right-long text-amber-600 group-hover:text-amber-300 transition shrink-0 text-xs"></i>
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="p-3 sm:p-4 bg-parchment-100 border-t border-parchment-300 flex justify-between items-center">
                  <span className="text-xs text-ink-700 italic">Tip: You can combine years, prices, and genres in your own custom sentences!</span>
                  <button
                    onClick={() => setIsExamplesModalOpen(false)}
                    className="px-4 py-2 bg-mahogany-700 hover:bg-mahogany-800 text-white rounded-lg text-xs font-semibold"
                  >
                    Close Catalog
                  </button>
                </div>
              </div>
            </div>
          )}

          {isDbExplorerOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 z-50 animate-fadeIn">
              <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-parchment-300 overflow-hidden">
                
                <div className="bg-mahogany-900 text-parchment-100 px-6 py-4 flex items-center justify-between border-b border-mahogany-700">
                  <div className="flex items-center gap-2.5">
                    <i className="fa-solid fa-database text-amber-400 text-lg"></i>
                    <h2 className="font-serif font-bold text-lg text-parchment-100">Riverside Books Database Explorer</h2>
                  </div>
                  <button
                    onClick={() => setIsDbExplorerOpen(false)}
                    className="text-parchment-300 hover:text-white p-1 rounded-lg transition"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="flex bg-parchment-100 border-b border-parchment-300 overflow-x-auto p-2 gap-1">
                  {[
                    { id: 'books', label: 'books & inventory_status', icon: 'fa-book' },
                    { id: 'query_builder', label: 'SQL & Custom Query Console', icon: 'fa-terminal' },
                    { id: 'store_info', label: 'store_info', icon: 'fa-store' },
                    { id: 'events', label: 'events', icon: 'fa-calendar-days' },
                    { id: 'merchandise', label: 'merchandise', icon: 'fa-gift' },
                    { id: 'social_accounts', label: 'social_accounts', icon: 'fa-share-nodes' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveDbTab(tab.id)}
                      className={`px-3.5 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${
                        activeDbTab === tab.id
                          ? 'bg-mahogany-700 text-white shadow-2xs'
                          : 'text-ink-700 hover:bg-parchment-200'
                      }`}
                    >
                      <i className={`fa-solid ${tab.icon}`}></i>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                <div className="flex-1 overflow-auto p-4 bg-parchment-50">
                  {activeDbTab === 'query_builder' && (
                    <div className="space-y-4">
                      <div className="bg-white p-4 rounded-xl border border-parchment-300 shadow-sm space-y-3">
                        <h3 className="font-serif font-bold text-sm text-mahogany-900 flex items-center gap-2">
                          <i className="fa-solid fa-sliders text-amber-600"></i>
                          Interactive Visual SQL Query Builder
                        </h3>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                          <div>
                            <label className="block font-medium text-gray-700 mb-1">Target Table</label>
                            <select 
                              value={qbTable} 
                              onChange={(e) => setQbTable(e.target.value)}
                              className="w-full bg-parchment-50 border border-parchment-300 rounded-lg p-2 font-mono"
                            >
                              <option value="books">books (Catalog)</option>
                              <option value="events_joined">events JOIN books</option>
                              <option value="merchandise">merchandise</option>
                            </select>
                          </div>

                          <div>
                            <label className="block font-medium text-gray-700 mb-1">Max Price Limit ($)</label>
                            <input 
                              type="number" 
                              placeholder="e.g. 20" 
                              value={qbMaxPrice} 
                              onChange={(e) => setQbMaxPrice(e.target.value)}
                              className="w-full bg-parchment-50 border border-parchment-300 rounded-lg p-2 font-mono"
                            />
                          </div>

                          <div>
                            <label className="block font-medium text-gray-700 mb-1">Stock Level Filter</label>
                            <select 
                              value={qbStockFilter} 
                              onChange={(e) => setQbStockFilter(e.target.value)}
                              className="w-full bg-parchment-50 border border-parchment-300 rounded-lg p-2 font-mono"
                            >
                              <option value="all">All Items</option>
                              <option value="in_stock">In Stock (&gt;0)</option>
                              <option value="low_stock">Low Stock (&lt;=2)</option>
                              <option value="out_of_stock">Out of Stock (=0)</option>
                            </select>
                          </div>

                          <div>
                            <label className="block font-medium text-gray-700 mb-1">Sort By Order</label>
                            <select 
                              value={qbSortBy} 
                              onChange={(e) => setQbSortBy(e.target.value)}
                              className="w-full bg-parchment-50 border border-parchment-300 rounded-lg p-2 font-mono"
                            >
                              <option value="none">Default Order</option>
                              <option value="price_asc">Price: Low to High</option>
                              <option value="price_desc">Price: High to Low</option>
                              <option value="year_desc">Year: Newest First</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block font-medium text-gray-700 mb-1 text-xs">Search Keyword (Title / Author / Genre)</label>
                          <input 
                            type="text" 
                            placeholder="e.g. Thorne, Fiction..." 
                            value={qbCustomKeyword} 
                            onChange={(e) => setQbCustomKeyword(e.target.value)}
                            className="w-full bg-parchment-50 border border-parchment-300 rounded-lg p-2 text-xs font-mono"
                          />
                        </div>

                        <button 
                          onClick={() => {
                            let toolName = "advanced_book_search";
                            let args = {
                              query: qbCustomKeyword,
                              max_price: qbMaxPrice ? parseFloat(qbMaxPrice) : undefined,
                              stock_status: qbStockFilter !== 'all' ? qbStockFilter : undefined,
                              sort_by: qbSortBy !== 'none' ? qbSortBy : undefined
                            };
                            if (qbTable === 'events_joined') toolName = "relational_event_books";
                            else if (qbTable === 'merchandise') {
                              toolName = "search_merchandise";
                              args = { query: qbCustomKeyword, max_price: qbMaxPrice ? parseFloat(qbMaxPrice) : undefined };
                            }

                            const result = executeDatabaseTool(toolName, args);
                            setQbResults({ toolName, args, result });
                          }}
                          className="bg-mahogany-700 hover:bg-mahogany-800 text-white font-semibold text-xs px-4 py-2 rounded-lg transition flex items-center gap-2"
                        >
                          <i className="fa-solid fa-play"></i>
                          <span>Execute Query</span>
                        </button>
                      </div>

                      {qbResults && (
                        <div className="bg-white p-4 rounded-xl border border-parchment-300 space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="font-serif font-bold text-xs text-mahogany-900">Query Output Result</span>
                            <span className="text-[10px] font-mono bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">
                              Matches Found: {qbResults.result.match_count ?? qbResults.result.joined_records ?? qbResults.result.results?.length ?? 0}
                            </span>
                          </div>
                          <pre className="bg-parchment-100 text-ink-900 p-3 rounded-lg font-mono text-[11px] overflow-x-auto max-h-52 border border-parchment-200">
                            {JSON.stringify(qbResults.result, null, 2)}
                          </pre>
                        </div>
                      )}
                    </div>
                  )}

                  {activeDbTab === 'books' && (
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs text-left text-ink-800 border-collapse">
                        <thead>
                          <tr className="bg-parchment-200 text-mahogany-900 font-serif border-b border-parchment-300">
                            <th className="p-2.5">ID</th>
                            <th className="p-2.5">Title</th>
                            <th className="p-2.5">Author</th>
                            <th className="p-2.5">Genre</th>
                            <th className="p-2.5">Year</th>
                            <th className="p-2.5">Price</th>
                            <th className="p-2.5">Stock</th>
                            <th className="p-2.5">Status View</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-parchment-200">
                          {RIVERSIDE_DATABASE.books.map(book => {
                            const status = getInventoryStatus(book);
                            return (
                              <tr key={book.id} className="hover:bg-parchment-100">
                                <td className="p-2.5 font-mono text-gray-500">{book.id}</td>
                                <td className="p-2.5 font-semibold text-mahogany-900">{book.title}</td>
                                <td className="p-2.5">{book.author}</td>
                                <td className="p-2.5">{book.genre}</td>
                                <td className="p-2.5 font-mono">{book.published_year}</td>
                                <td className="p-2.5 font-mono">${book.price.toFixed(2)}</td>
                                <td className="p-2.5 font-mono font-bold">{book.stock_quantity}</td>
                                <td className="p-2.5">
                                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                    status.stock_level === 'Out of Stock' ? 'bg-red-100 text-red-800' :
                                    status.stock_level === 'Low Stock' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                                  }`}>
                                    {status.stock_level}
                                  </span>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {activeDbTab === 'store_info' && (
                    <div className="space-y-3 text-xs bg-white p-4 rounded-xl border border-parchment-300">
                      <div><strong className="text-mahogany-900 font-serif text-sm">Store Name:</strong> {RIVERSIDE_DATABASE.store_info.store_name}</div>
                      <div><strong className="text-mahogany-900 font-serif text-sm">Address:</strong> {RIVERSIDE_DATABASE.store_info.address}</div>
                      <div><strong className="text-mahogany-900 font-serif text-sm">Hours:</strong> {RIVERSIDE_DATABASE.store_info.hours}</div>
                      <div><strong className="text-mahogany-900 font-serif text-sm">Return Policy:</strong> {RIVERSIDE_DATABASE.store_info.return_policy}</div>
                    </div>
                  )}

                  {activeDbTab === 'events' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {RIVERSIDE_DATABASE.events.map(ev => (
                        <div key={ev.id} className="bg-white p-3.5 rounded-xl border border-parchment-300 space-y-1.5 text-xs">
                          <div className="font-serif font-bold text-mahogany-900 text-sm">{ev.title}</div>
                          <div className="text-amber-800 font-semibold">{ev.event_date} • {ev.time}</div>
                          <p className="text-gray-600 leading-normal">{ev.description}</p>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeDbTab === 'merchandise' && (
                    <table className="w-full text-xs text-left text-ink-800 border-collapse">
                      <thead>
                        <tr className="bg-parchment-200 text-mahogany-900 font-serif border-b border-parchment-300">
                          <th className="p-2.5">Item Name</th>
                          <th className="p-2.5">Category</th>
                          <th className="p-2.5">Price</th>
                          <th className="p-2.5">Stock</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-parchment-200">
                        {RIVERSIDE_DATABASE.merchandise.map(item => (
                          <tr key={item.id} className="hover:bg-parchment-100">
                            <td className="p-2.5 font-semibold text-mahogany-900">{item.item_name}</td>
                            <td className="p-2.5">{item.category}</td>
                            <td className="p-2.5 font-mono">${item.price.toFixed(2)}</td>
                            <td className="p-2.5 font-mono font-bold">{item.stock_quantity}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}

                  {activeDbTab === 'social_accounts' && (
                    <div className="space-y-2 text-xs">
                      {RIVERSIDE_DATABASE.social_accounts.map((s, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg border border-parchment-300 flex justify-between items-center">
                          <span className="font-semibold text-mahogany-900">{s.platform}</span>
                          <span className="text-amber-800 font-mono">{s.handle}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="p-3 bg-parchment-100 border-t border-parchment-300 text-right">
                  <button
                    onClick={() => setIsDbExplorerOpen(false)}
                    className="px-4 py-2 bg-mahogany-700 hover:bg-mahogany-800 text-white rounded-lg text-xs font-semibold"
                  >
                    Close Explorer
                  </button>
                </div>
              </div>
            </div>
          )}

          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-parchment-300 space-y-4">
                <div className="flex items-center justify-between border-b border-parchment-200 pb-3">
                  <h3 className="font-serif font-bold text-lg text-mahogany-900 flex items-center gap-2">
                    <i className="fa-solid fa-key text-amber-600"></i>
                    Gemini API Settings
                  </h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-gray-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-semibold text-mahogany-900 block">GEMINI_API_KEY</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full bg-parchment-50 border border-parchment-300 rounded-lg px-3.5 py-2 text-xs font-mono focus:ring-2 focus:ring-mahogany-600 focus:outline-none"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="px-4 py-2 bg-mahogany-700 text-white rounded-lg text-xs font-semibold hover:bg-mahogany-800"
                  >
                    Save & Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
