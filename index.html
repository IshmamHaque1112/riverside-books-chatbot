    // Helper function to fetch from Supabase with case-insensitive table names
    async function fetchFromSupabase(table, options = {}) {
      const { select = '*', filters = {}, limit = null, orderBy = null } = options;
      
      // For the books table, load the capitalized table first.
      let tableNames = [table, table.charAt(0).toUpperCase() + table.slice(1)];
      if (table.toLowerCase() === 'books') {
        tableNames = ['Books', 'books']; // Try uppercase first for books
      }
      
      for (const tableName of tableNames) {
        let url = `${SUPABASE_URL}/rest/v1/${tableName}?select=${select}`;
        
        // Add filters
        Object.entries(filters).forEach(([key, value]) => {
          if (value !== undefined && value !== null) {
            url += `&${key}=eq.${encodeURIComponent(value)}`;
          }
        });
        
        // Add ordering
        if (orderBy) {
          url += `&order=${orderBy.column}&order=${orderBy.ascending ? 'asc' : 'desc'}`;
        }
        
        // Add limit (only if specified, otherwise get all rows)
        if (limit) {
          url += `&limit=${limit}`;
        }
        
        console.log(`[Supabase Request] ${tableName}:`, url);
        
        try {
          const response = await fetch(url, {
            headers: {
              'apikey': SUPABASE_API_KEY,
              'Authorization': `Bearer ${SUPABASE_API_KEY}`,
              'Content-Type': 'application/json',
              'prefer': 'count=exact' // Get exact count
            }
          });
          
          if (!response.ok) {
            const errorText = await response.text();
            console.log(`[Supabase Try Failed] ${tableName}:`, response.status);
            continue; // Try next table name
          }
          
          const data = await response.json();
          const count = response.headers.get('content-range') || response.headers.get('x-total-count');
          console.log(`[Supabase Success] ${tableName}:`, data.length, 'records', count ? `(total: ${count})` : '');
          return data;
        } catch (error) {
          console.log(`[Supabase Network Error] ${tableName}:`, error.message);
          continue; // Try next table name
        }
      }
      
      // If all attempts failed
      throw new Error(`Could not fetch table '${table}' (tried: ${tableNames.join(', ')})`);
    }

    // Small edit-distance helper so misspelled searches ("salt stras",
    // "in stok") can still match real titles instead of returning nothing.
    function levenshteinDistance(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[m][n];
    }

    // Generic filler words that survive query-cleaning regexes in practice
    // ("how many", "do you carry", "on the shelf", "right now", "would a
    // staff member", "u guys got"...). Filtering these HERE, inside the
    // matcher itself, means the match quality no longer depends on every
    // possible phrasing being anticipated upstream in cleanQuery.
    const GENERIC_STOPWORDS = new Set([
      'the','a','an','is','are','was','were','do','does','did','you','your','yours','i','we','us',
      'me','my','of','in','on','at','for','with','by','to','and','or','but','how','many','much',
      'right','now','it','its','this','that','these','those','can','could','would','should','will',
      'shall','have','has','had','about','any','some','if','still','yet','get','got','guys','idk',
      'thing','name','carry','shelf','sell','buy','still','just','really','also','please','thanks',
      'yeah','yep','nah','okay','ok',
      // Currency words: the numeric price itself is already pulled out by
      // maxPriceMatch upstream, but the word describing the currency
      // ("dollars", "$20 dollars", "20 bucks") is left behind in cleanQuery.
      // Without stripping it here, it survives as the only "meaningful"
      // token and gets applied as a bogus second filter requiring some
      // book's title/author/genre to literally contain "dollars" — which
      // none do, silently zeroing out an otherwise-correct price search.
      'dollar','dollars','buck','bucks','usd','cents','cent',
      // Framing/filler words that survive even after a structured filter
      // (genre, staff_pick, bestseller, published_year...) has already been
      // pulled out of the same phrase — without this, the leftover word
      // becomes a second, contradictory title/author requirement.
      'anything','author','named','from','looking','title','titled','book','books',
      'collection','collections','staff','member','members','came','come','out',
      'kind','kinds','type','types','category','categories','recommend','recommended',
      'recommendation','bestseller','bestsellers','seller','pick','picks','copy','copies',
      'not','remember','exact','but','has','order','ordering','notified','notify','notification',
      'when','back','custom','else','besides','soon','meeting','join','does','want','wanted',
      'give','tell','idk','know','don','dont','ll','ve','re','between'
    ]);

    function meaningfulTokens(text) {
      return (text || '').toLowerCase()
        .replace(/[^\w\s]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length >= 3 && !GENERIC_STOPWORDS.has(w));
    }

    // Typo-tolerant "does this query describe this text" check. Falls back
    // to per-word fuzzy matching (allowing small typos) when a plain
    // substring match fails.
    function fuzzyTextMatch(text, query) {
      if (!text) return false;
      const t = text.toLowerCase();
      const q = (query || '').toLowerCase().trim();
      if (!q) return false;
      if (t.includes(q)) return true;

      const textWords = meaningfulTokens(t);
      const queryWords = meaningfulTokens(q);
      if (queryWords.length === 0 || textWords.length === 0) return false;

      const matchedCount = queryWords.filter(qw =>
        textWords.some(tw => {
          // Guard: for short words, only allow a fuzzy/containment match if
          // the two words are close in LENGTH too, not just edit distance.
          // Without this, a short common word can coincidentally sit inside
          // a longer, unrelated word ("story" is 2 edits from "history",
          // and literally a substring of it) and produce a false match.
          // Genuine typos ("stras" vs "stars") keep the same length, so
          // this doesn't block real typo tolerance.
          if (Math.abs(tw.length - qw.length) > 1 && Math.min(tw.length, qw.length) < 6) {
            return false;
          }
          return tw.includes(qw) || qw.includes(tw) || levenshteinDistance(tw, qw) <= 2;
        })
      ).length;

      return (matchedCount / queryWords.length) >= 0.6 || matchedCount >= 2;
    }

    // Get inventory status for a book
    async function getBookInventoryStatus(bookId) {
      try {
        const inventory = await fetchFromSupabase('inventory', {
          filters: { book_id: bookId },
          limit: 1
        });
        
        if (inventory && inventory.length > 0) {
          const inv = inventory[0];
          let stockLevel = "Medium Stock";
          if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
          else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
          else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
          
          return {
            stock_quantity: inv.qty_in_stock,
            stock_level: stockLevel,
            needs_reorder: inv.needs_reorder,
            low_stock_threshold: inv.low_stock_threshold
          };
        }
      } catch (error) {
        console.error('Error fetching inventory:', error);
      }
      
      return { stock_quantity: 0, stock_level: "Unknown", needs_reorder: false, low_stock_threshold: 5 };
    }

    async function executeDatabaseTool(name, args) {
      console.log(`[Database Query Executed] Tool: ${name}`, args);
      
      try {
        switch(name) {
          case "reserve_book_copy": {
            try {
              // Find the book by title
              const books = await fetchFromSupabase('books');
              const bookTitleQuery = (args.book_title || "").toLowerCase().trim();
              const bookMatch = books.find(b => b.title.toLowerCase().includes(bookTitleQuery));
              
              const reservationId = "RES-" + Math.floor(100000 + Math.random() * 900000);
              const quantity = args.quantity || 1;
              const customerName = args.customer_name || "Valued Customer";
              const contact = args.email_or_phone || "(503) 555-0192";

              // Get inventory status
              let stockStatus = { stock_quantity: 0, stock_level: "Out of Stock" };
              if (bookMatch) {
                stockStatus = await getBookInventoryStatus(bookMatch.book_id);
              }

              const newReservation = {
                id: reservationId,
                book_title: bookMatch ? bookMatch.title : args.book_title,
                book_id: bookMatch ? bookMatch.book_id : null,
                customer_name: customerName,
                contact: contact,
                quantity: quantity,
                timestamp: new Date().toLocaleString(),
                status: stockStatus.stock_quantity > 0 ? "Held for Pickup" : "Pre-order Queued (Restocking Soon)"
              };

              return {
                success: true,
                reservation_id: reservationId,
                reservation_details: newReservation,
                book_stock_status: stockStatus
              };
            } catch (error) {
              console.error('Error in reserve_book_copy:', error);
              return { 
                success: false, 
                error: `Reservation failed: ${error.message}`,
                reservation_id: null,
                reservation_details: null,
                book_stock_status: { stock_quantity: 0, stock_level: "Unknown" }
              };
            }
          }

          case "advanced_book_search": {
            try {
              console.log('[advanced_book_search] Starting search with args:', args);
              
              // Fetch books
              const books = await fetchFromSupabase('books');
              console.log('[advanced_book_search] Books fetched:', books?.length);
              
              if (!books || books.length === 0) {
                return { criteria_applied: args, match_count: 0, results: [] };
              }
              
              // Simple mapping without inventory first
              let results = books.map(book => ({
                id: book.book_id,
                title: book.title || 'Unknown Title',
                author: book.author || 'Unknown Author',
                price: book.regular_price || 0,
                genre: book.genre || 'Unknown Genre',
                isbn: book.isbn || 'Unknown ISBN',
                format: book.format || 'Unknown Format',
                rating: book.rating ?? 'Unrated',
                blurb: book.blurb || '',
                bestseller: !!book.bestseller,
                staff_pick: !!book.staff_pick,
                pub_date: book.pub_date || 'Unknown',
                published_year: book.pub_date ? new Date(book.pub_date).getFullYear() : 'Unknown',
                stock_quantity: 0, // Will be updated if inventory available
                stock_level: "Unknown"
              }));

              // Try to get inventory data (now handles case sensitivity automatically)
              try {
                const inventory = await fetchFromSupabase('inventory');
                const inventoryMap = {};
                inventory.forEach(inv => {
                  inventoryMap[inv.book_id] = inv;
                });
                
                // Update with inventory data
                results = results.map(book => {
                  const inv = inventoryMap[book.id] || {};
                  let stockLevel = "Medium Stock";
                  if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
                  else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
                  else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
                  
                  return {
                    ...book,
                    stock_quantity: inv.qty_in_stock || 0,
                    stock_level: stockLevel
                  };
                });
              } catch (invError) {
                console.warn('[advanced_book_search] Could not fetch inventory, showing books without stock data');
              }

              // Apply filters
              if (args.genre && args.genre.trim()) {
                const searchGenre = args.genre.toLowerCase().trim();
                results = results.filter(b => b.genre.toLowerCase().includes(searchGenre));
              }

              if (args.query && args.query.trim()) {
                // Match against the combined title+author+genre text rather
                // than checking each field separately. A query like "Distant
                // Maps by Otis Pryce" splits its tokens across title AND
                // author — checking fields independently means neither half
                // alone clears the match threshold, so it wrongly finds
                // nothing even though the book exists.
                results = results.filter(b => 
                  fuzzyTextMatch(`${b.title} ${b.author} ${b.genre}`, args.query)
                );
              }

              if (typeof args.max_price === 'number') {
                results = results.filter(b => b.price <= args.max_price);
              }
              if (typeof args.min_price === 'number') {
                results = results.filter(b => b.price >= args.min_price);
              }

              if (typeof args.published_year === 'number') {
                results = results.filter(b => b.published_year === args.published_year);
              }

              if (typeof args.published_after === 'number') {
                results = results.filter(b => b.published_year >= args.published_after);
              }
              if (typeof args.published_before === 'number') {
                results = results.filter(b => b.published_year <= args.published_before);
              }

              if (args.stock_status) {
                if (args.stock_status === 'in_stock') results = results.filter(b => b.stock_quantity > 0);
                else if (args.stock_status === 'low_stock') results = results.filter(b => b.stock_quantity > 0 && b.stock_quantity <= 5);
                else if (args.stock_status === 'out_of_stock') results = results.filter(b => b.stock_quantity === 0);
              }

              if (args.format) {
                const wantFormat = args.format.trim().toLowerCase();
                results = results.filter(b => (b.format || '').toLowerCase() === wantFormat);
              }
              if (args.bestseller === true) {
                results = results.filter(b => b.bestseller === true);
              }
              if (args.staff_pick === true) {
                results = results.filter(b => b.staff_pick === true);
              }
              if (typeof args.min_rating === 'number') {
                results = results.filter(b => typeof b.rating === 'number' && b.rating >= args.min_rating);
              }

              if (args.sort_by) {
                if (args.sort_by === 'price_asc') results.sort((a,b) => a.price - b.price);
                else if (args.sort_by === 'price_desc') results.sort((a,b) => b.price - a.price);
                else if (args.sort_by === 'year_desc') results.sort((a,b) => b.published_year - a.published_year);
                else if (args.sort_by === 'year_asc') results.sort((a,b) => a.published_year - b.published_year);
                else if (args.sort_by === 'title') results.sort((a,b) => a.title.localeCompare(b.title));
                else if (args.sort_by === 'rating_desc') results.sort((a,b) => (b.rating || 0) - (a.rating || 0));
              }

              if (typeof args.limit === 'number' && args.limit > 0) {
                results = results.slice(0, args.limit);
              }

              console.log('[advanced_book_search] Results:', results.length);
              return {
                criteria_applied: args,
                match_count: results.length,
                results: results
              };
            } catch (error) {
              console.error('[advanced_book_search] Error:', error);
              return { error: `Search failed: ${error.message}`, criteria_applied: args, match_count: 0, results: [] };
            }
          }

          case "relational_event_books": {
            try {
              const events = await fetchFromSupabase('events');
              const books = await fetchFromSupabase('books');
              
              // Try to get inventory (now handles case sensitivity automatically)
              let inventory = [];
              try {
                inventory = await fetchFromSupabase('inventory');
              } catch (invError) {
                console.warn('[relational_event_books] Could not fetch inventory');
              }
              
              // Create inventory map
              const inventoryMap = {};
              inventory.forEach(inv => {
                inventoryMap[inv.book_id] = inv;
              });

              const joinedEvents = await Promise.all(events.map(async event => {
                let bookDetails = null;
                if (event.book_id) {
                  const book = books.find(b => b.book_id === event.book_id);
                  if (book) {
                    const inv = inventoryMap[book.book_id] || {};
                    let stockLevel = "Medium Stock";
                    if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
                    else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
                    else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
                    
                    bookDetails = {
                      id: book.book_id,
                      title: book.title,
                      author: book.author,
                      price: book.regular_price,
                      stock_quantity: inv.qty_in_stock || 0,
                      stock_level: stockLevel
                    };
                  }
                }
                
                return {
                  id: event.event_id,
                  title: event.event_name,
                  event_date: event.event_date,
                  time: event.event_time,
                  location: event.event_location,
                  description: event.event_description,
                  book_id: event.book_id,
                  ticket_price: event.ticket_price,
                  book_details: bookDetails
                };
              }));
              
              return {
                joined_records: joinedEvents.length,
                events_with_inventory: joinedEvents
              };
            } catch (error) {
              console.error('Error in relational_event_books:', error);
              return { error: `Events query failed: ${error.message}`, joined_records: 0, events_with_inventory: [] };
            }
          }

          case "search_books": {
            try {
              const q = (args.query || "").toLowerCase();
              const books = await fetchFromSupabase('books');
              
              // Try to get inventory (now handles case sensitivity automatically)
              let inventory = [];
              try {
                inventory = await fetchFromSupabase('inventory');
              } catch (invError) {
                console.warn('[search_books] Could not fetch inventory');
              }
              
              const inventoryMap = {};
              inventory.forEach(inv => {
                inventoryMap[inv.book_id] = inv;
              });

              const matches = books.filter(b => 
                fuzzyTextMatch(`${b.title} ${b.author} ${b.genre}`, q)
              ).map(book => {
                const inv = inventoryMap[book.book_id] || {};
                let stockLevel = "Medium Stock";
                if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
                else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
                else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
                
                return {
                  id: book.book_id,
                  title: book.title || 'Unknown Title',
                  author: book.author || 'Unknown Author',
                  price: book.regular_price || 0,
                  genre: book.genre || 'Unknown Genre',
                  isbn: book.isbn || 'Unknown ISBN',
                  format: book.format || 'Unknown Format',
                  rating: book.rating ?? 'Unrated',
                  blurb: book.blurb || '',
                  bestseller: !!book.bestseller,
                  staff_pick: !!book.staff_pick,
                  pub_date: book.pub_date || 'Unknown',
                  published_year: book.pub_date ? new Date(book.pub_date).getFullYear() : 'Unknown',
                  stock_quantity: inv.qty_in_stock || 0,
                  stock_level: stockLevel
                };
              });
              
              return {
                query: args.query,
                match_count: matches.length,
                results: matches
              };
            } catch (error) {
              console.error('Error in search_books:', error);
              return { error: `Search failed: ${error.message}`, query: args.query, match_count: 0, results: [] };
            }
          }

          case "get_store_hours": {
            const storeInfo = getStoreInfo();
            return {
              store_name: storeInfo.store_name,
              hours: storeInfo.hours
            };
          }

          case "get_return_policy": {

            return {
              return_policy: storeInfo.return_policy,
              exchange_policy: storeInfo.exchange_policy
            };
          }

          case "get_rewards_info": {

            return {
              reward_rule: storeInfo.reward_rule,

            };
          }

          case "get_available_genres": {
            try {

              return {

              };
            } catch (error) {
              console.error('Error in get_available_genres:', error);

            }
          }

          case "get_social_links": {
            try {
              const accounts = await fetchFromSupabase('social_accounts');
              const info = (accounts && accounts[0]) || {};
              return {

              };
            } catch (error) {
              console.error('Error in get_social_links:', error);
              return { error: `Social links query failed: ${error.message}` };
            }
          }

          case "get_upcoming_events": {
            try {
              // Default raised from 5 to 25 (there are only ~18 events) so
              // "does event X exist" / "events for book Y" questions can see
              // the full calendar instead of just the next 5 chronologically.
              const limit = args.limit || 25;
              const events = await fetchFromSupabase('events', {
                orderBy: { column: 'event_date', ascending: true }
              });
              
              let upcomingEvents = events.map(event => ({
                id: event.event_id,
                title: event.event_name,
                event_date: event.event_date,
                time: event.event_time,
                location: event.event_location,
                description: event.event_description,
                book_id: event.book_id,
                ticket_price: event.ticket_price
              }));

              if (typeof args.month === 'number') {
                upcomingEvents = upcomingEvents.filter(e => {
                  const d = new Date(e.event_date + 'T00:00:00');
                  return (d.getMonth() + 1) === args.month;
                });
              }

              if (args.free_only === true) {
                upcomingEvents = upcomingEvents.filter(e => e.ticket_price === 0);
              } else if (args.free_only === false) {
                upcomingEvents = upcomingEvents.filter(e => e.ticket_price > 0);
              }

              if (args.query && meaningfulTokens(args.query).length > 0) {
                const filtered = upcomingEvents.filter(e =>
                  fuzzyTextMatch(e.title, args.query) || fuzzyTextMatch(e.description || '', args.query)
                );
                // Only apply the filter if it actually found something —
                // an over-eager filter shouldn't silently empty a response
                // that would otherwise have shown the full calendar.
                if (filtered.length > 0) upcomingEvents = filtered;
              }

              upcomingEvents = upcomingEvents.slice(0, limit);
              
              return {
                total_events: events.length,
                upcoming_events: upcomingEvents
              };
            } catch (error) {
              console.error('Error in get_upcoming_events:', error);
              return { error: `Events query failed: ${error.message}`, total_events: 0, upcoming_events: [] };

          }

          case "get_about_store": {
            const storeInfo = getStoreInfo();
            return {
              store_name: storeInfo.store_name,
              about_text: storeInfo.about_text,
              address: storeInfo.address,
              phone: storeInfo.phone,
              email: storeInfo.email
            };
          }

          case "search_merchandise": {
            try {
              const q = (args.query || "").toLowerCase();
              const merchandise = await fetchFromSupabase('merchandise');
              
              let items = merchandise.slice();

              if (typeof args.max_price === 'number') {
                items = items.filter(m => m.price <= args.max_price);
              }
              if (typeof args.min_price === 'number') {
                items = items.filter(m => m.price >= args.min_price);
              }
              if (args.item_type) {
                const wantType = args.item_type.trim().toLowerCase();
                items = items.filter(m => m.item_type.toLowerCase() === wantType);
              }

              if (q) {
                const textFiltered = items.filter(m => fuzzyTextMatch(m.item_name, q) || fuzzyTextMatch(m.item_type, q));
                // Only apply the text filter if it actually found something
                // within the already-narrowed (price/type) set — otherwise
                // a generic descriptor like "greeting" (no item is literally
                // named that) would wipe out an otherwise-correct "Cards
                // under $20" browse down to zero.
                if (textFiltered.length > 0) items = textFiltered;
              }

              if (args.sort_by === 'price_asc') items.sort((a,b) => a.price - b.price);
              else if (args.sort_by === 'price_desc') items.sort((a,b) => b.price - a.price);
              if (typeof args.limit === 'number' && args.limit > 0) {
                items = items.slice(0, args.limit);
              }
              
              const results = items.map(item => ({
                id: item.item_id,
                item_name: item.item_name,
                item_type: item.item_type,
                price: item.price
              }));
              
              return {
                query: args.query,
                results: results
              };
            } catch (error) {
              console.error('Error in search_merchandise:', error);
              return { error: `Merchandise search failed: ${error.message}`, query: args.query, results: [] };
            }
          }

          default:
            return { error: `Unknown tool name: ${name}` };
        }
      } catch (error) {
        console.error('Error executing database tool:', error);
        return { error: `Database error: ${error.message}` };
      }
    }

    // Local mode normally makes exactly one tool call per message — fine for
    // "is X in stock" but not for "which is cheaper, X or Y", which needs
    // two separate lookups plus an actual comparison, not just a dump of
    // both books' data. Handling that class of question explicitly here.
    function extractComparisonTitles(input) {
      let m;
      m = input.match(/is\s+(.+?)\s+(?:more expensive|pricier|cheaper|less expensive)\s+than\s+(.+?)[\?\.]?$/i);
      if (m) return [m[1].trim(), m[2].trim()];
      m = input.match(/between\s+(.+?)\s+and\s+(.+?)[,\?\.].*$/i);
      if (m) return [m[1].trim(), m[2].trim()];
      m = input.match(/which\s+(?:one\s+)?(?:is|has)\b[^,]*,?\s+(.+?)\s+or\s+(.+?)[\?\.]?$/i);
      if (m) return [m[1].trim(), m[2].trim()];
      m = input.match(/more copies of\s+(.+?)\s+or\s+(.+?)\b(?:\s+in stock)?[\?\.]?$/i);
      if (m) return [m[1].trim(), m[2].trim()];
      return null;
    }

    async function tryHandleComparisonQuestion(userInput) {
      const input = userInput.toLowerCase();
      const isComparisonShaped = /\b(cheaper|more expensive|pricier|less expensive|higher rating|higher rated|more copies|which one|between)\b/i.test(input) && (/ or | and |\bthan\b/i.test(input));
      if (!isComparisonShaped) return null;

      const titles = extractComparisonTitles(userInput);
      if (!titles) return null;

      const [rawA, rawB] = titles;
      const cleanTitle = (t) => t.replace(/^(the|a|an)\s+/i, '').replace(/[^\w\s]/g, '').trim();

      const [resA, resB] = await Promise.all([
        executeDatabaseTool('advanced_book_search', { query: cleanTitle(rawA), limit: 1 }),
        executeDatabaseTool('advanced_book_search', { query: cleanTitle(rawB), limit: 1 })
      ]);

      const bookA = resA.results && resA.results[0];
      const bookB = resB.results && resB.results[0];

      if (!bookA || !bookB) {
        const missing = !bookA && !bookB ? `either "${rawA}" or "${rawB}"` : (!bookA ? `"${rawA}"` : `"${rawB}"`);
        return {
          text: `I couldn't find ${missing} in our catalog to compare — could you double-check the title?`,
          toolCalled: { name: 'advanced_book_search', args: { rawA, rawB }, result: { bookA, bookB } }
        };
      }

      let metric, verdict;
      if (/\b(cheaper|more expensive|pricier|less expensive)\b/i.test(input)) {
        metric = 'price';
        const cheaper = bookA.price <= bookB.price ? bookA : bookB;
        const pricier = cheaper === bookA ? bookB : bookA;
        verdict = `**${cheaper.title}** ($${cheaper.price.toFixed(2)}) is cheaper than **${pricier.title}** ($${pricier.price.toFixed(2)}).`;
      } else if (/\b(higher rating|higher rated|rating)\b/i.test(input)) {
        metric = 'rating';
        const higher = (bookA.rating || 0) >= (bookB.rating || 0) ? bookA : bookB;
        const lower = higher === bookA ? bookB : bookA;
        verdict = `**${higher.title}** has the higher rating (⭐ ${higher.rating}/5 vs ⭐ ${lower.rating}/5 for **${lower.title}**).`;
      } else if (/\b(more copies|copies|stock)\b/i.test(input)) {
        metric = 'stock';
        const more = bookA.stock_quantity >= bookB.stock_quantity ? bookA : bookB;
        const less = more === bookA ? bookB : bookA;
        verdict = `**${more.title}** has more copies in stock (${more.stock_quantity} vs ${less.stock_quantity} for **${less.title}**).`;
      } else if (/\b(actually buy|can i buy|buy today|available)\b/i.test(input)) {
        metric = 'availability';
        const aAvail = bookA.stock_quantity > 0;
        const bAvail = bookB.stock_quantity > 0;
        if (aAvail && bAvail) verdict = `Both **${bookA.title}** and **${bookB.title}** are currently in stock and available to buy today.`;
        else if (aAvail) verdict = `**${bookA.title}** is in stock (${bookA.stock_quantity} copies) — **${bookB.title}** is currently out of stock.`;
        else if (bAvail) verdict = `**${bookB.title}** is in stock (${bookB.stock_quantity} copies) — **${bookA.title}** is currently out of stock.`;
        else verdict = `Unfortunately both **${bookA.title}** and **${bookB.title}** are currently out of stock.`;
      } else {
        // Fallback: just lay out both books' key facts side by side.
        metric = 'general';
        verdict = `Here's what I found for both:`;
      }

      const detailLine = (b) => `• **${b.title}** by ${b.author} — $${b.price.toFixed(2)}, ⭐ ${b.rating}/5, ${b.stock_quantity} in stock`;
      const text = `${verdict}\n\n${detailLine(bookA)}\n${detailLine(bookB)}`;

      return {
        text,
        toolCalled: { name: 'advanced_book_search (comparison)', args: { titleA: bookA.title, titleB: bookB.title, metric }, result: { bookA, bookB } }
      };
    }

    async function tryHandleAuthorAggregation(userInput) {
      const input = userInput.toLowerCase();
      if (!/\b(which author|what author)\b.*\b(most books|most titles)\b/i.test(input)) return null;

      const res = await executeDatabaseTool('advanced_book_search', {});
      const books = (res.results || []);
      const counts = {};
      books.forEach(b => { counts[b.author] = (counts[b.author] || 0) + 1; });

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (sorted.length === 0) {
        return { text: `I wasn't able to look up author counts right now.`, toolCalled: { name: 'advanced_book_search', args: {}, result: {} } };
      }

      const [topAuthor, topCount] = sorted[0];
      const tied = sorted.filter(([, c]) => c === topCount).map(([a]) => a);
      let text;
      if (tied.length === 1) {
        text = `**${topAuthor}** has the most titles in our store, with ${topCount} books.`;
      } else if (tied.length <= 5) {
        text = `A few authors are tied for the most titles in our store, each with ${topCount}: ${tied.join(', ')}.`;
      } else {
        text = `Every author in our store currently has the same number of titles (${topCount} each) — no single author has more than the others yet.`;
      }

      return { text, toolCalled: { name: 'advanced_book_search (author aggregation)', args: {}, result: { counts } } };
    }

    async function processLocalQuery(userInput) {
      const comparisonResult = await tryHandleComparisonQuestion(userInput);
      if (comparisonResult) return comparisonResult;

      const aggregationResult = await tryHandleAuthorAggregation(userInput);
      if (aggregationResult) return aggregationResult;

      const input = userInput.toLowerCase();
      let toolName = null;
      let toolArgs = {};

      if (input.includes("reserve") || input.includes("hold") || input.includes("pre-order") || input.includes("preorder")) {
        toolName = "reserve_book_copy";
        
        // Try to find a book title in the input
        let foundTitle = null;
        try {
          const books = await fetchFromSupabase('books');
          if (books && books.length > 0) {
            for (const b of books) {
              if (input.includes(b.title.toLowerCase())) {
                foundTitle = b.title;
                break;
              }
            }
          }
        } catch (error) {
          console.error('Error fetching books for reservation:', error);
          // Fallback to generic response if Supabase fails
          foundTitle = "The River of Tides"; // Use a known book from the dataset
        }
        
        toolArgs = {
          book_title: foundTitle || "Unknown Book",
          customer_name: "Valued Customer",
          email_or_phone: "(503) 555-0192"
        };
      } else if (
        /\b(do you have|do you sell|do you carry|got|is (the|this|that)|are)\b.*\b(tote|mug|journal|bookmark|card|gift|candle|pin|socks|notebook|puzzle|sticker|postcard|tumbler|notecard)\b/i.test(input)
      ) {
        // A specific "do you have/sell/carry the [item]" pattern is an
        // unambiguous product lookup — it should win even when the product
        // NAME happens to contain a word that would otherwise trigger a
        // different route (e.g. "Reading Is A River Mug" contains "reading",
        // "Birthday Books Card" contains "birthday", "Book Club Tumbler"
        // contains "club" — none of those are what the customer meant).
        toolName = "search_merchandise";
        const rawMerchQuery = input
          .replace(/\b(cheapest|least expensive|most expensive|priciest|do you have|do you sell|what'?s|what|is|are|any|the|a|an|your|my|in|for|of|could|would|buy|get|purchase|got|need|want|looking|gifts?|cards?|items?|shop|store|things?|stuff)\b/gi, '')
          .replace(/[^\w\s]/g, ' ')
          .trim();
        toolArgs = {
          query: (meaningfulTokens(rawMerchQuery).length > 0) ? rawMerchQuery : undefined
        };
      } else if (input.includes("instagram") || input.includes("tiktok") || input.includes("social media") || (input.includes("website") && !input.includes("event")) || (input.includes("app") && (input.includes("order") || input.includes("store")))) {
        toolName = "get_social_links";
      } else if (input.includes("event") && (/\bbook\b/i.test(input) || input.includes("stock"))) {
        toolName = "relational_event_books";
      } else if (
        input.includes("event") || input.includes("signing") || input.includes("club") ||
        input.includes("talk") || input.includes("reading") || input.includes("fair") ||
        input.includes("tasting") || input.includes("workshop") || input.includes("story hour") ||
        input.includes("author reading") || input.includes("author event") || input.includes("ticket") ||
        input.includes("happening") || input.includes("illustrator") || input.includes("meet the")
      ) {
        toolName = "get_upcoming_events";

        // Only strip TRUE filler words here — NOT event-type nouns like
        // "club", "author", "reading", "gift", "talk", "tasting". Those were
        // being stripped before (since they're also used to *detect* this
        // route), which meant the search query could never distinguish
        // "Author Reading" from "Cookbook Tasting" for the same book, or
        // "Book Club Discussion" from any other event.
        const rawEventQuery = input
          .replace(/\b(event|events|ticket|tickets|happening|signing|is|there|do|does|you|have|any|at|on|in|the|a|an|being|held|start|starts|starting|time|what|whats|whens|when|where|how|much|this|coming|weekend|next|second|two|separate|scheduled|related|specific|to|about|tell|me|it|its|can|i|for|of|out|stock)\b/gi, '')
          .replace(/[^\w\s]/g, ' ')
          .trim();

        // "Free"/"paid" and month names are structured filters, not text to
        // search for in a title — a December event's title rarely contains
        // the word "december". Detect them separately instead of relying on
        // fuzzy text matching against the title/description.
        const monthNames = ['january','february','march','april','may','june','july','august','september','october','november','december'];
        const mentionedMonth = monthNames.findIndex(m => input.includes(m));
        const wantsFree = /\bfree\b/i.test(input) && !/\bfree to\b/i.test(input);
        const wantsPaid = /\bpaid\b/i.test(input);
        const wantsNext = /\b(next|soonest|upcoming|first)\b/.test(input) && /\b(chronologically|next event|next one|coming up)\b/i.test(input);

        toolArgs = {
          limit: wantsNext ? 1 : 25,
          query: (meaningfulTokens(rawEventQuery).length > 0) ? rawEventQuery : undefined,
          month: mentionedMonth >= 0 ? (mentionedMonth + 1) : undefined,
          free_only: wantsFree ? true : (wantsPaid ? false : undefined)
        };
      } else if (input.includes("hours") || input.includes("open") || input.includes("close") || (input.includes("time") && !input.includes("what time does"))) {
        toolName = "get_store_hours";
      } else if (input.includes("return") || input.includes("exchange") || input.includes("policy") || input.includes("refund")) {
        toolName = "get_return_policy";
      } else if (input.includes("reward") || input.includes("point") || input.includes("birthday") || input.includes("membership") || input.includes("discount")) {
        toolName = "get_rewards_info";
      } else if (input.includes("genres") || input.includes("categories") || input.includes("what kinds of books") || input.includes("kinds of books do you") || /\bwhat genre(s)? do you\b/i.test(input)) {
        toolName = "get_available_genres";
      } else if (/\babout (the store|riverside|your store|us|this store)\b/i.test(input) || input.includes("address") || input.includes("location") || input.includes("phone") || input.includes("email")) {
        toolName = "get_about_store";
      } else if (input.includes("tote") || input.includes("mug") || input.includes("journal") || input.includes("bookmark") || input.includes("card") || input.includes("gift") || input.includes("candle") || input.includes("pin") || input.includes("socks") || input.includes("notebook") || input.includes("puzzle") || input.includes("sticker") || input.includes("postcard") || input.includes("tumbler") || input.includes("notecard")) {
        toolName = "search_merchandise";
        const cheapestMerch = input.includes("cheapest") || input.includes("least expensive");
        const priciestMerch = input.includes("most expensive") || input.includes("priciest");
        const merchMinPriceMatch = input.match(/(?:above|over|more than|greater than|starting at|starting from|at least|min)\s*\$?(\d+(?:\.\d+)?)/i);
        const merchMinPrice = merchMinPriceMatch ? parseFloat(merchMinPriceMatch[1]) : undefined;
        const merchMaxPriceMatch = input.match(/(?:under|below|less than|max|cheaper than)\s*\$?(\d+(?:\.\d+)?)/i);
        const merchMaxPrice = merchMaxPriceMatch ? parseFloat(merchMaxPriceMatch[1]) : undefined;
        const rawMerchQuery = input
          .replace(/\b(under|below|less than|max|cheaper than|above|over|more than|greater than|starting at|starting from|at least|min)\s*\$?\d+(?:\.\d+)?\b/gi, '')
          .replace(/\b(cheapest|least expensive|most expensive|priciest|do you have|do you sell|what'?s|what|is|are|any|the|a|an|your|my|in|for|of|could|would|buy|get|purchase|need|want|looking|gifts?|cards?|items?|shop|store|things?|stuff)\b/gi, '')
          .replace(/[^\w\s]/g, ' ')
          .trim();
        toolArgs = {
          query: (meaningfulTokens(rawMerchQuery).length > 0) ? rawMerchQuery : undefined,
          sort_by: cheapestMerch ? 'price_asc' : (priciestMerch ? 'price_desc' : undefined),
          limit: (cheapestMerch || priciestMerch) ? 1 : undefined,
          max_price: merchMaxPrice,
          min_price: merchMinPrice,
          item_type: input.includes("card") ? "Card" : undefined
        };
      } else {
        toolName = "advanced_book_search";

        // "between $X and $Y" is a genuine range — check it before the
        // individual min/max regexes, since "between" matches neither the
        // floor list nor the ceiling list on its own and was previously
        // grabbing only the first number as an incorrect one-sided max.
        const rangeMatch = input.match(/between\s*\$?(\d+(?:\.\d+)?)\s*and\s*\$?(\d+(?:\.\d+)?)/i);
        const rangeLow = rangeMatch ? Math.min(parseFloat(rangeMatch[1]), parseFloat(rangeMatch[2])) : undefined;
        const rangeHigh = rangeMatch ? Math.max(parseFloat(rangeMatch[1]), parseFloat(rangeMatch[2])) : undefined;

        const minPriceMatch = !rangeMatch && input.match(/(?:above|over|more than|greater than|starting at|starting from|at least|min)\s*\$?(\d+(?:\.\d+)?)/i);
        const extractedMinPrice = rangeMatch ? rangeLow : (minPriceMatch ? parseFloat(minPriceMatch[1]) : undefined);

        const maxPriceMatch = !rangeMatch && (input.match(/(?:under|below|less than|max|cheaper than)\s*\$?(\d+(?:\.\d+)?)/i)
          || (!minPriceMatch ? input.match(/\$(\d+(?:\.\d+)?)/) : null));
        const extractedMaxPrice = rangeMatch ? rangeHigh : (maxPriceMatch ? parseFloat(maxPriceMatch[1]) : undefined);

        const yearBeforeMatch = input.match(/(?:before|prior to|older than|earlier than|pre-?)\s*(\d{4})/i);
        let extractedYearBefore = yearBeforeMatch ? parseInt(yearBeforeMatch[1], 10) : undefined;

        const yearAfterMatch = input.match(/(?:after|since|newer than|post-?)\s*(\d{4})/i);
        let extractedYearAfter = yearAfterMatch ? parseInt(yearAfterMatch[1], 10) : undefined;

        const yearExactMatch = input.match(/(?:published in|in year|from year|year)\s*(\d{4})/i) || input.match(/\b(20\d{2}|19\d{2})\b/);
        let extractedYearExact = (!yearBeforeMatch && !yearAfterMatch && yearExactMatch) ? parseInt(yearExactMatch[1], 10) : undefined;

        let extractedFormat = undefined;
        const mentionsHardcover = input.includes("hardcover");
        const mentionsSoftcover = input.includes("softcover") || input.includes("paperback");
        // "Is X hardcover or softcover?" mentions both — that's a question
        // about which one applies, not a filter request. Only treat it as a
        // filter when exactly one format word appears (e.g. "hardcover
        // mysteries"), otherwise let the search find the book and show its
        // real format instead of silently filtering it out.
        if (mentionsHardcover && !mentionsSoftcover) extractedFormat = "Hardcover";
        else if (mentionsSoftcover && !mentionsHardcover) extractedFormat = "Softcover";

        const extractedBestseller = input.includes("bestseller") || input.includes("best seller") ? true : undefined;
        const extractedStaffPick = (input.includes("staff pick") || input.includes("staff recommend") || input.includes("recommend")) ? true : undefined;

        let extractedSortBy = undefined;
        if (input.includes("cheapest") || input.includes("least expensive") || input.includes("lowest price")) extractedSortBy = "price_asc";
        else if (input.includes("most expensive") || input.includes("priciest") || input.includes("highest price")) extractedSortBy = "price_desc";
        else if (input.includes("highest rated") || input.includes("best rated") || input.includes("top rated")) extractedSortBy = "rating_desc";
        const extractedLimit = /\b(cheapest|most expensive|priciest|highest rated|best rated)\b/.test(input) ? 1 : undefined;

        let extractedStockStatus = undefined;
        if (input.includes("low stock") || input.includes("running low")) {
          extractedStockStatus = "low_stock";
        } else if (input.includes("out of stock") || input.includes("sold out")) {
          extractedStockStatus = "out_of_stock";
        } else if (input.includes("high stock") || input.includes("in stock") || input.includes("available")) {
          extractedStockStatus = "in_stock";
        }

        let extractedGenre = undefined;
        const knownGenres = await getAvailableGenres();
        for (const g of knownGenres) {
          if (input.includes(g.toLowerCase())) {
            extractedGenre = g;
            break;
          }
        }
        if (!extractedGenre) {
          if (input.includes("science fiction")) extractedGenre = "Science Fiction";
          else if (input.includes("literary fiction")) extractedGenre = "Literary Fiction";
          else if (input.includes("fiction") && !input.includes("historical") && !input.includes("literary")) extractedGenre = "Literary Fiction";
          else if (input.includes("historical fiction")) extractedGenre = "Historical Fiction";
          else if (input.includes("historical")) extractedGenre = "Historical Fiction";
          else if (input.includes("fantasy")) extractedGenre = "Fantasy";
          else if (input.includes("mystery")) extractedGenre = "Mystery";
          else if (input.includes("thriller")) extractedGenre = "Thriller";
          else if (input.includes("romance")) extractedGenre = "Romance";
          else if (input.includes("cookbook") || input.includes("cooking")) extractedGenre = "Cookbook";
          else if (input.includes("nature")) extractedGenre = "Nature";
          else if (input.includes("history")) extractedGenre = "History";
          else if (input.includes("poetry")) extractedGenre = "Poetry";
          else if (input.includes("children") || input.includes("kids")) extractedGenre = "Children's";
          else if (input.includes("memoir")) extractedGenre = "Memoir";
          else if (input.includes("essay")) extractedGenre = "Essay Collection";
        }

        let cleanQuery = input
          .replace(/(?:under|below|less than|max|cheaper than|over|above|more than|min|at least|\$)\s*\$?(\d+(?:\.\d+)?)/gi, '')
          .replace(/(?:before|prior to|older than|earlier than|after|since|newer than|published in|in year|from year|year)\s*(\d{4})/gi, '')
          .replace(/\b(20\d{2}|19\d{2})\b/g, '')
          .replace(new RegExp(knownGenres.join('|'), 'gi'), '')
          .replace(/\b(high stock|low stock|out of stock|sold out|in stock|available|running low)\b/gi, '')
          .replace(/\b(do you have|can i find|show me|find|search|list|get|are there|any|books?|copies|published|year|price|cost|under|below|above|before|after|in|stock|low|out of|available|genre|category|isbn|number|format|hardcover|softcover|paperback|cover|edition|who|wrote|writes|written|author of|was|are|is|the|a|an|of|for|what's|whats|what|bestseller|best seller|staff pick|staff recommend|recommend|cheapest|least expensive|lowest price|most expensive|priciest|highest price|highest rated|best rated|top rated)\b/gi, '')
          .replace(/[^\w\s]/g, '')
          .trim();

        const finalQuery = (meaningfulTokens(cleanQuery).length > 0) ? cleanQuery : undefined;

        // If the customer named a specific book, don't let a stock-status
        // phrase ("...in stock?") silently filter it out of the results —
        // that turns "is Salt Maps in stock" (true answer: 0 copies) into a
        // false-sounding "we don't have that book" instead of showing the
        // real number. Stock-status filters only make sense for browse-type
        // queries ("what's low on stock") where there's no specific title.
        if (finalQuery) {
          extractedStockStatus = undefined;
        }

        toolArgs = {
          query: finalQuery,
          genre: extractedGenre,
          max_price: extractedMaxPrice,
          min_price: extractedMinPrice,
          published_year: extractedYearExact,
          published_before: extractedYearBefore,
          published_after: extractedYearAfter,
          stock_status: extractedStockStatus,
          format: extractedFormat,
          bestseller: extractedBestseller,
          staff_pick: extractedStaffPick,
          sort_by: extractedSortBy,
          limit: extractedLimit
        };
      }

      const dbData = await executeDatabaseTool(toolName, toolArgs);
      let responseText = "";

      if (toolName === "reserve_book_copy") {
        responseText = `✅ **Reservation Confirmed!**\n\n• **Reservation ID:** ${dbData.reservation_id}\n• **Book:** *${dbData.reservation_details.book_title}*\n• **Status:** ${dbData.reservation_details.status}\n\nWe will notify you at pickup or when your restock arrives. You can also view this in the DB Explorer under Reservations!`;
        
        // Store reservation in local state for DB Explorer
        if (dbData.success && dbData.reservation_details) {
          if (typeof window !== 'undefined' && window.currentSetDbReservations) {
            window.currentSetDbReservations(prev => [...prev, dbData.reservation_details]);
          }
        }
      } else if (toolName === "advanced_book_search" || toolName === "search_books") {
        if (dbData.results && dbData.results.length > 0) {
          const list = dbData.results.map(b => {
            const ratingStr = (typeof b.rating === 'number') ? `⭐ ${b.rating}/5` : 'Unrated';
            const stockNote = b.stock_quantity === 0
              ? `**Out of stock** — call us at (503) 555-0192 to ask about a special order or being notified when it's back`
              : `**${b.stock_quantity} in stock**`;
            const blurbLine = b.blurb ? `\n  ${b.blurb}` : '';
            return `• **${b.title}** by ${b.author} - $${b.price ? b.price.toFixed(2) : 'N/A'} (${b.genre}, ${b.format}, published ${b.pub_date || b.published_year}) [${ratingStr}] [${stockNote}] — ISBN: ${b.isbn}${blurbLine}`;
          }).join("\n");
          
          const ambiguityNote = dbData.results.length > 1
            ? `\n\nI found ${dbData.results.length} possible matches — let me know which one you meant if this isn't the right one.`
            : '';
          responseText = `Here are matching books from our database:\n\n${list}${ambiguityNote}\n\nWant to place a hold or pre-order any title? Just ask!`;
        } else {
          responseText = `I searched our inventory using your criteria, but found no matching books. You can call us at (503) 555-0192 for custom orders.`;
        }
      } else if (toolName === "get_available_genres") {
        const genreList = dbData.genres.map(g => `• ${g}`).join("\n");
        responseText = `Here are the book genres we currently curate at Riverside Books:\n\n${genreList}`;
      } else if (toolName === "relational_event_books") {
        const eventsList = dbData.events_with_inventory.map(e => {
          const bookInfo = e.book_details 
            ? `📖 *${e.book_details.title}* ($${e.book_details.price ? e.book_details.price.toFixed(2) : 'N/A'} - ${e.book_details.stock_quantity} in stock)`
            : '📖 Featured title details available at counter';
          return `• **${e.title}**\n  📆 Date: ${e.event_date} (${e.time})\n  ${bookInfo}`;
        }).join("\n\n");
        responseText = `Here are our upcoming bookstore events alongside live stock status for featured books:\n\n${eventsList}`;
      } else if (toolName === "get_store_hours") {
        responseText = `Our store hours at Riverside Books are:\n\n📅 **${dbData.hours}**`;
      } else if (toolName === "get_return_policy") {
        responseText = `Here is our return and exchange policy:\n\n• **Returns:** ${dbData.return_policy}\n• **Exchanges:** ${dbData.exchange_policy}`;
      } else if (toolName === "get_rewards_info") {
        responseText = `With our **Riverside Readers** program:\n\n• **Points:** ${dbData.reward_rule}\n• **Birthday Perk:** ${dbData.birthday_discount_rule}`;
      } else if (toolName === "get_upcoming_events") {
        const evList = dbData.upcoming_events.map(e => {
          const priceLine = (typeof e.ticket_price === 'number')
            ? (e.ticket_price === 0 ? '🎟️ Free' : `🎟️ $${e.ticket_price.toFixed(2)}`)
            : '';
          return `• **${e.title}**\n  📆 ${e.event_date} (${e.time})\n  📍 ${e.location}\n  ${priceLine}\n  ℹ️ ${e.description}`;
        }).join("\n\n");
        responseText = `Here are our upcoming events at Riverside Books:\n\n${evList}`;
      } else if (toolName === "get_about_store") {
        responseText = `**${dbData.store_name}**\n${dbData.about_text}\n\n📍 **Address:** ${dbData.address}\n📞 **Phone:** ${dbData.phone}`;
      } else if (toolName === "get_social_links") {
        const links = [
          dbData.instagram && `• **Instagram:** ${dbData.instagram}`,
          dbData.tiktok && `• **TikTok:** ${dbData.tiktok}`,
          dbData.x && `• **X:** ${dbData.x}`,
          dbData.website && `• **Website:** ${dbData.website}`,
          dbData.app_store && `• **App Store:** ${dbData.app_store}`,
          dbData.play_store && `• **Google Play:** ${dbData.play_store}`
        ].filter(Boolean).join("\n");
        responseText = `You can find us online here:\n\n${links}`;
      } else if (toolName === "search_merchandise") {
        if (dbData.results && dbData.results.length > 0) {
          const items = dbData.results.map(m => `• **${m.item_name}** (${m.item_type}) - $${m.price ? m.price.toFixed(2) : 'N/A'}`).join("\n");
          responseText = `Here is what we found in our gift and merchandise inventory:\n\n${items}`;
        } else {
          responseText = `I couldn't find a specific match for that in our gift shop inventory — feel free to ask about a specific item, or call us at (503) 555-0192 and we can help you find something.`;
        }
      }

      return {
        text: responseText,
        toolCalled: { name: toolName, args: toolArgs, result: dbData }
      };
    }

      async function callGeminiApi(userQuery, history) {
        const endpoint = '/api/gemini';

        const contents = history.map(msg => ({
          role: msg.sender === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        }));

        contents.push({ role: 'user', parts: [{ text: userQuery }] });

        const systemInstruction = await getSystemInstruction();

        // Loop instead of a single round-trip: comparison questions ("is X
        // cheaper than Y?") and multi-part questions ("hours, and is X in
        // stock?") need Gemini to call more than one tool in the same turn.
        // Cap iterations so a confused model can't loop forever.
        const MAX_TOOL_ROUNDS = 6;
        let lastToolCalled = null;

        for (let round = 0; round < MAX_TOOL_ROUNDS; round++) {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: contents,
              tools: [{ functionDeclarations: TOOL_DECLARATIONS }],
              systemInstruction: { parts: [{ text: systemInstruction }] }
            })
          });

          if (!response.ok) {
            throw new Error(`API returned status ${response.status}`);
          }

          const data = await response.json();
          const candidate = data.candidates?.[0];
          const part = candidate?.content?.parts?.[0];

          if (part && part.functionCall) {
            const toolCall = part.functionCall;
            const toolResult = await executeDatabaseTool(toolCall.name, toolCall.args || {});

            lastToolCalled = { name: toolCall.name, args: toolCall.args, result: toolResult };
            setActiveToolInfo(lastToolCalled);

            // Append this round's model turn + our function response, then
            // let the next iteration ask Gemini whether it needs another tool.
            contents.push(candidate.content);
            contents.push({
              role: 'user',
              parts: [{
                functionResponse: {
                  name: toolCall.name,
                  response: { content: toolResult }
                }
              }]
            });
            continue;
          }

          return {
            text: part?.text || "I'm here to help with Riverside Books questions!",
            toolCalled: lastToolCalled
          };
        }

        return {
          text: "I looked up several things but couldn't quite finish putting the answer together — could you rephrase or ask me one thing at a time?",
          toolCalled: lastToolCalled
        };
      }

            ]);

                              <div className="text-amber-800 font-semibold">{ev.event_date} • {ev.event_time}</div>
                              <p className="text-gray-600 leading-normal">{ev.event_description}</p>
                            </div>
                          ))}
                        </div>
                      )}

                      {activeDbTab === 'merchandise' && (
                        <table className="w-full text-xs text-left text-ink-800 border-collapse">
                          <thead>
                            <tr className="bg-parchment-200 text-mahogany-900 font-serif border-b border-parchment-300">
                              <th className="p-2.5">Item Name</th>
                              <th className="p-2.5">Category</th>
                              <th className="p-2.5">Price</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-parchment-200">
                            {dbMerchandise.map(item => (
                              <tr key={item.item_id} className="hover:bg-parchment-100">
                                <td className="p-2.5 font-semibold text-mahogany-900">{item.item_name}</td>
                                <td className="p-2.5">{item.item_type}</td>
                                <td className="p-2.5 font-mono">${item.price ? item.price.toFixed(2) : 'N/A'}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                    </>
                  )}
                </div>

                <div className="p-3 bg-parchment-100 border-t border-parchment-300 text-right">
                  <button onClick={() => setIsDbExplorerOpen(false)} className="px-4 py-2 bg-mahogany-700 text-white rounded-lg text-xs font-semibold">
                    Close Explorer
                  </button>
                </div>
              </div>
            </div>
          )}

          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-parchment-300 space-y-4">
                <div className="flex items-center justify-between border-b border-parchment-200 pb-3">
                  <h3 className="font-serif font-bold text-lg text-mahogany-900 flex items-center gap-2">
                    <i className="fa-solid fa-key text-amber-600"></i>
                    Gemini Connection
                  </h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-gray-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <p className="text-sm text-gray-600">
                  Gemini is configured securely on the server. Set the <code>GEMINI_API_KEY</code>
                  environment variable in Vercel to enable it.
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-2 bg-mahogany-700 text-white rounded-lg text-xs font-semibold hover:bg-mahogany-800">
                    Save & Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
