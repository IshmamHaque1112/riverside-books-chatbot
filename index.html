    // Helper function to fetch from Supabase with case-insensitive table names
    async function fetchFromSupabase(table, options = {}) {
      const { select = '*', filters = {}, limit = null, orderBy = null } = options;
      
      // For books table, try uppercase first (Book has 35 rows, books has 3 rows)
      let tableNames = [table, table.charAt(0).toUpperCase() + table.slice(1)];
      if (table.toLowerCase() === 'books') {
        tableNames = ['Book', 'books']; // Try uppercase first for books
      }
      
      for (const tableName of tableNames) {
        let url = `${SUPABASE_URL}/rest/v1/${tableName}?select=${select}`;
        
        // Add filters
        Object.entries(filters).forEach(([key, value]) => {
          if (value !== undefined && value !== null) {
            url += `&${key}=eq.${encodeURIComponent(value)}`;
          }
        });
        
        // Add ordering
        if (orderBy) {
          url += `&order=${orderBy.column}&order=${orderBy.ascending ? 'asc' : 'desc'}`;
        }
        
        // Add limit (only if specified, otherwise get all rows)
        if (limit) {
          url += `&limit=${limit}`;
        }
        
        console.log(`[Supabase Request] ${tableName}:`, url);
        
        try {
          const response = await fetch(url, {
            headers: {
              'apikey': SUPABASE_API_KEY,
              'Authorization': `Bearer ${SUPABASE_API_KEY}`,
              'Content-Type': 'application/json',
              'prefer': 'count=exact' // Get exact count
            }
          });
          
          if (!response.ok) {
            const errorText = await response.text();
            console.log(`[Supabase Try Failed] ${tableName}:`, response.status);
            continue; // Try next table name
          }
          
          const data = await response.json();
          const count = response.headers.get('content-range') || response.headers.get('x-total-count');
          console.log(`[Supabase Success] ${tableName}:`, data.length, 'records', count ? `(total: ${count})` : '');
          return data;
        } catch (error) {
          console.log(`[Supabase Network Error] ${tableName}:`, error.message);
          continue; // Try next table name
        }
      }
      
      // If all attempts failed
      throw new Error(`Could not fetch table '${table}' (tried: ${tableNames.join(', ')})`);
    }

    // Get inventory status for a book
    async function getBookInventoryStatus(bookId) {
      try {
        const inventory = await fetchFromSupabase('inventory', {
          filters: { book_id: bookId },
          limit: 1
        });
        
        if (inventory && inventory.length > 0) {
          const inv = inventory[0];
          let stockLevel = "Medium Stock";
          if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
          else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
          else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
          
          return {
            stock_quantity: inv.qty_in_stock,
            stock_level: stockLevel,
            needs_reorder: inv.needs_reorder,
            low_stock_threshold: inv.low_stock_threshold
          };
        }
      } catch (error) {
        console.error('Error fetching inventory:', error);
      }
      
      return { stock_quantity: 0, stock_level: "Unknown", needs_reorder: false, low_stock_threshold: 5 };
    }

    const getInventoryStatus = (book) => {
      let level = "Medium Stock";
      if (book.stock_quantity === 0) level = "Out of Stock";
      else if (book.stock_quantity <= 2) level = "Low Stock";
      else if (book.stock_quantity >= 8) level = "High Stock";

      return {
        ...book,
        stock_level: level,
        needs_reorder: book.stock_quantity <= book.reorder_threshold
      };
    };

              };
            }
          }

          case "advanced_book_search": {
            try {
              console.log('[advanced_book_search] Starting search with args:', args);
              
              // Fetch books
              const books = await fetchFromSupabase('books');
              console.log('[advanced_book_search] Books fetched:', books?.length);
              
              if (!books || books.length === 0) {
                return { criteria_applied: args, match_count: 0, results: [] };
              }
              
              // Simple mapping without inventory first
              let results = books.map(book => ({
                id: book.book_id,
                title: book.title || 'Unknown Title',
                author: book.author || 'Unknown Author',
                price: book.regular_price || 0,
                genre: book.genre || 'Unknown Genre',
                isbn: book.isbn || 'Unknown ISBN',
                published_year: book.pub_date ? new Date(book.pub_date).getFullYear() : 'Unknown',
                stock_quantity: 0, // Will be updated if inventory available
                stock_level: "Unknown"
              }));

              // Try to get inventory data (now handles case sensitivity automatically)
              try {
                const inventory = await fetchFromSupabase('inventory');
                const inventoryMap = {};
                inventory.forEach(inv => {
                  inventoryMap[inv.book_id] = inv;
                });
                
                // Update with inventory data
                results = results.map(book => {
                  const inv = inventoryMap[book.id] || {};
                  let stockLevel = "Medium Stock";
                  if (inv.qty_in_stock === 0) stockLevel = "Out of Stock";
                  else if (inv.qty_in_stock <= inv.low_stock_threshold) stockLevel = "Low Stock";
                  else if (inv.qty_in_stock >= 10) stockLevel = "High Stock";
                  
                  return {
                    ...book,
                    stock_quantity: inv.qty_in_stock || 0,
                    stock_level: stockLevel
                  };
                });
              } catch (invError) {
                console.warn('[advanced_book_search] Could not fetch inventory, showing books without stock data');
              }

              // Apply filters
              if (args.genre && args.genre.trim()) {
                const searchGenre = args.genre.toLowerCase().trim();
                results = results.filter(b => b.genre.toLowerCase().includes(searchGenre));
              }

              if (args.query && args.query.trim()) {
                const q = args.query.toLowerCase().trim();
                results = results.filter(b => 
                  b.title.toLowerCase().includes(q) || 
                  b.author.toLowerCase().includes(q) || 
                  b.genre.toLowerCase().includes(q)
                );
              }

              if (typeof args.max_price === 'number') {
                results = results.filter(b => b.price <= args.max_price);
              }
              if (typeof args.min_price === 'number') {
                results = results.filter(b => b.price >= args.min_price);
              }

              if (typeof args.published_year === 'number') {
                results = results.filter(b => b.published_year === args.published_year);
              }

              if (typeof args.published_after === 'number') {
                results = results.filter(b => b.published_year >= args.published_after);
              }
              if (typeof args.published_before === 'number') {
                results = results.filter(b => b.published_year <= args.published_before);
              }

              if (args.stock_status) {
                if (args.stock_status === 'in_stock') results = results.filter(b => b.stock_quantity > 0);
                else if (args.stock_status === 'low_stock') results = results.filter(b => b.stock_quantity > 0 && b.stock_quantity <= 5);
                else if (args.stock_status === 'out_of_stock') results = results.filter(b => b.stock_quantity === 0);
              }

              if (args.sort_by) {
                if (args.sort_by === 'price_asc') results.sort((a,b) => a.price - b.price);
                else if (args.sort_by === 'price_desc') results.sort((a,b) => b.price - a.price);
                else if (args.sort_by === 'year_desc') results.sort((a,b) => b.published_year - a.published_year);
                else if (args.sort_by === 'year_asc') results.sort((a,b) => a.published_year - b.published_year);
                else if (args.sort_by === 'title') results.sort((a,b) => a.title.localeCompare(b.title));
              }

              if (typeof args.limit === 'number' && args.limit > 0) {
                results = results.slice(0, args.limit);

              return {

              const upcomingEvents = events.map(event => ({
                id: event.event_id,
                title: event.event_name,
                event_date: event.event_date,
                time: event.event_time,
                location: event.event_location,
                description: event.event_description,
                book_id: event.book_id,
                ticket_price: event.ticket_price
              }));
              
              return {
                total_events: events.length,
                upcoming_events: upcomingEvents
              };
            } catch (error) {
              console.error('Error in get_upcoming_events:', error);
              return { error: `Events query failed: ${error.message}`, total_events: 0, upcoming_events: [] };
            }
          }

          case "get_about_store": {
            const storeInfo = getStoreInfo();
            return {
              store_name: storeInfo.store_name,
              about_text: storeInfo.about_text,
              address: storeInfo.address,
              phone: storeInfo.phone,
              email: storeInfo.email
            };
          }

          case "search_merchandise": {
            try {
              const q = (args.query || "").toLowerCase();
              const merchandise = await fetchFromSupabase('merchandise');
              
              let items = merchandise.filter(m => 
                m.item_name.toLowerCase().includes(q) || 
                m.item_type.toLowerCase().includes(q)
              );
              
              if (typeof args.max_price === 'number') {
                items = items.filter(m => m.price <= args.max_price);
              }
              
              const results = items.map(item => ({
                id: item.item_id,
                item_name: item.item_name,
                category: item.item_type,
                price: item.price
              }));
              
              return {
                query: args.query,
                results: results
              };
            } catch (error) {
              console.error('Error in search_merchandise:', error);
              return { error: `Merchandise search failed: ${error.message}`, query: args.query, results: [] };
            }
          }

          default:
            return { error: `Unknown tool name: ${name}` };
        }
      } catch (error) {
        console.error('Error executing database tool:', error);
        return { error: `Database error: ${error.message}` };
      }
    }

    async function processLocalQuery(userInput) {
      const input = userInput.toLowerCase();
      let toolName = null;
      let toolArgs = {};

      if (input.includes("reserve") || input.includes("hold") || input.includes("pre-order") || input.includes("preorder")) {
        toolName = "reserve_book_copy";
        
        // Try to find a book title in the input
        let foundTitle = null;
        try {
          const books = await fetchFromSupabase('books');
          if (books && books.length > 0) {
            for (const b of books) {
              if (input.includes(b.title.toLowerCase())) {
                foundTitle = b.title;
                break;
              }
            }
          }
        } catch (error) {
          console.error('Error fetching books for reservation:', error);
          // Fallback to generic response if Supabase fails
          foundTitle = "The River of Tides"; // Use a known book from the dataset
        }
        
        toolArgs = {
          book_title: foundTitle || "Unknown Book",
          customer_name: "Valued Customer",
          email_or_phone: "(503) 555-0192"
        };
      } else if (input.includes("hours") || input.includes("open") || input.includes("close") || input.includes("time")) {
        toolName = "get_store_hours";
      } else if (input.includes("return") || input.includes("exchange") || input.includes("policy") || input.includes("refund")) {
        toolName = "get_return_policy";
      } else if (input.includes("reward") || input.includes("point") || input.includes("birthday") || input.includes("membership") || input.includes("discount")) {
        toolName = "get_rewards_info";
      } else if (input.includes("genre") || input.includes("categories") || input.includes("what kinds of books")) {
        toolName = "get_available_genres";
      } else if (input.includes("about") || input.includes("address") || input.includes("location") || input.includes("phone") || input.includes("email")) {
        toolName = "get_about_store";
      } else if (input.includes("event") && (input.includes("book") || input.includes("stock"))) {
        toolName = "relational_event_books";
      } else if (input.includes("event") || input.includes("signing") || input.includes("club")) {
        toolName = "get_upcoming_events";
        toolArgs = { limit: 5 };
      } else if (input.includes("tote") || input.includes("mug") || input.includes("journal") || input.includes("bookmark")) {
        toolName = "search_merchandise";
        toolArgs = { query: input };
      } else {
        toolName = "advanced_book_search";

        const maxPriceMatch = input.match(/(?:under|below|less than|max|cheaper than|\$)\s*\$?(\d+(?:\.\d+)?)/i);
        const extractedMaxPrice = maxPriceMatch ? parseFloat(maxPriceMatch[1]) : undefined;

        const yearBeforeMatch = input.match(/(?:before|prior to|older than|earlier than|pre-?)\s*(\d{4})/i);
        let extractedYearBefore = yearBeforeMatch ? parseInt(yearBeforeMatch[1], 10) : undefined;

        const yearAfterMatch = input.match(/(?:after|since|newer than|post-?)\s*(\d{4})/i);
        let extractedYearAfter = yearAfterMatch ? parseInt(yearAfterMatch[1], 10) : undefined;

        const yearExactMatch = input.match(/(?:published in|in year|from year|year)\s*(\d{4})/i) || input.match(/\b(20\d{2}|19\d{2})\b/);
        let extractedYearExact = (!yearBeforeMatch && !yearAfterMatch && yearExactMatch) ? parseInt(yearExactMatch[1], 10) : undefined;

        let extractedStockStatus = undefined;
        if (input.includes("low stock") || input.includes("running low")) {
          extractedStockStatus = "low_stock";
        } else if (input.includes("out of stock") || input.includes("sold out")) {
          extractedStockStatus = "out_of_stock";
        } else if (input.includes("high stock") || input.includes("in stock") || input.includes("available")) {
          extractedStockStatus = "in_stock";
        }

        let extractedGenre = undefined;
        const knownGenres = await getAvailableGenres();
        for (const g of knownGenres) {
          if (input.includes(g.toLowerCase())) {
            extractedGenre = g;
            break;
          }
        }
        if (!extractedGenre) {
          if (input.includes("science fiction")) extractedGenre = "Science Fiction";
          else if (input.includes("literary fiction")) extractedGenre = "Literary Fiction";
          else if (input.includes("fiction") && !input.includes("historical") && !input.includes("literary")) extractedGenre = "Literary Fiction";
          else if (input.includes("historical fiction")) extractedGenre = "Historical Fiction";
          else if (input.includes("historical")) extractedGenre = "Historical Fiction";
          else if (input.includes("fantasy")) extractedGenre = "Fantasy";
          else if (input.includes("mystery")) extractedGenre = "Mystery";
          else if (input.includes("thriller")) extractedGenre = "Thriller";
          else if (input.includes("romance")) extractedGenre = "Romance";
          else if (input.includes("cookbook") || input.includes("cooking")) extractedGenre = "Cookbook";
          else if (input.includes("nature")) extractedGenre = "Nature";
          else if (input.includes("history")) extractedGenre = "History";
          else if (input.includes("poetry")) extractedGenre = "Poetry";
          else if (input.includes("children") || input.includes("kids")) extractedGenre = "Children's";
          else if (input.includes("memoir")) extractedGenre = "Memoir";
          else if (input.includes("essay")) extractedGenre = "Essay Collection";
        }

        let cleanQuery = input
          .replace(/(?:under|below|less than|max|cheaper than|over|above|more than|min|at least|\$)\s*\$?(\d+(?:\.\d+)?)/gi, '')
          .replace(/(?:before|prior to|older than|earlier than|after|since|newer than|published in|in year|from year|year)\s*(\d{4})/gi, '')
          .replace(/\b(20\d{2}|19\d{2})\b/g, '')
          .replace(new RegExp(knownGenres.join('|'), 'gi'), '')
          .replace(/\b(high stock|low stock|out of stock|sold out|in stock|available|running low)\b/gi, '')
          .replace(/\b(do you have|can i find|show me|find|search|list|get|are there|any|books?|copies|published|year|price|cost|under|below|above|before|after|in|stock|low|out of|available|genre|category)\b/gi, '')
          .replace(/[^\w\s]/g, '')
          .trim();

        const finalQuery = (cleanQuery.length >= 2) ? cleanQuery : undefined;

        toolArgs = {
          query: finalQuery,
          genre: extractedGenre,
          max_price: extractedMaxPrice,
          published_year: extractedYearExact,
          published_before: extractedYearBefore,
          published_after: extractedYearAfter,
          stock_status: extractedStockStatus
        };
      }

      const dbData = await executeDatabaseTool(toolName, toolArgs);
      let responseText = "";

      if (toolName === "reserve_book_copy") {
        responseText = `✅ **Reservation Confirmed!**\n\n• **Reservation ID:** ${dbData.reservation_id}\n• **Book:** *${dbData.reservation_details.book_title}*\n• **Status:** ${dbData.reservation_details.status}\n\nWe will notify you at pickup or when your restock arrives. You can also view this in the DB Explorer under Reservations!`;
        
        // Store reservation in local state for DB Explorer
        if (dbData.success && dbData.reservation_details) {
          if (typeof window !== 'undefined' && window.currentSetDbReservations) {
            window.currentSetDbReservations(prev => [...prev, dbData.reservation_details]);
          }
        }
      } else if (toolName === "advanced_book_search") {
        if (dbData.results && dbData.results.length > 0) {
          const list = dbData.results.map(b => 
            `• **${b.title}** by ${b.author} - $${b.price ? b.price.toFixed(2) : 'N/A'} (${b.genre}, ${b.published_year}) [**${b.stock_quantity} in stock**]`
          ).join("\n");
          
          responseText = `Here are matching books from our database:\n\n${list}\n\nWant to place a hold or pre-order any title? Just ask!`;
        } else {
          responseText = `I searched our inventory using your criteria, but found no matching books. You can call us at (503) 555-0192 for custom orders.`;
        }
      } else if (toolName === "get_available_genres") {
        const genreList = dbData.genres.map(g => `• ${g}`).join("\n");
        responseText = `Here are the book genres we currently curate at Riverside Books:\n\n${genreList}`;
      } else if (toolName === "relational_event_books") {
        const eventsList = dbData.events_with_inventory.map(e => {
          const bookInfo = e.book_details 
            ? `📖 *${e.book_details.title}* ($${e.book_details.price ? e.book_details.price.toFixed(2) : 'N/A'} - ${e.book_details.stock_quantity} in stock)`
            : '📖 Featured title details available at counter';
          return `• **${e.title}**\n  📆 Date: ${e.event_date} (${e.time})\n  ${bookInfo}`;
        }).join("\n\n");
        responseText = `Here are our upcoming bookstore events alongside live stock status for featured books:\n\n${eventsList}`;
      } else if (toolName === "get_store_hours") {
        responseText = `Our store hours at Riverside Books are:\n\n📅 **${dbData.hours}**`;
      } else if (toolName === "get_return_policy") {
        responseText = `Here is our return and exchange policy:\n\n• **Returns:** ${dbData.return_policy}\n• **Exchanges:** ${dbData.exchange_policy}`;
      } else if (toolName === "get_rewards_info") {
        responseText = `With our **Riverside Readers** program:\n\n• **Points:** ${dbData.reward_rule}\n• **Birthday Perk:** ${dbData.birthday_discount_rule}`;
      } else if (toolName === "get_upcoming_events") {
        const evList = dbData.upcoming_events.map(e => `• **${e.title}**\n  📆 ${e.event_date} (${e.time})\n  ℹ️ ${e.description}`).join("\n\n");
        responseText = `Here are our upcoming events at Riverside Books:\n\n${evList}`;
      } else if (toolName === "get_about_store") {
        responseText = `**${dbData.store_name}**\n${dbData.about_text}\n\n📍 **Address:** ${dbData.address}\n📞 **Phone:** ${dbData.phone}`;
      } else if (toolName === "search_merchandise") {
        if (dbData.results && dbData.results.length > 0) {
          const items = dbData.results.map(m => `• **${m.item_name}** ($${m.price ? m.price.toFixed(2) : 'N/A'}) - ${m.stock_quantity} available`).join("\n");
          responseText = `Here is what we found in our gift and merchandise inventory:\n\n${items}`;
        } else {
          responseText = `We carry canvas tote bags, brass bookmarks, ceramic mugs, and hardcover reading journals!`;
        }
      }

      return {
        text: responseText,
        toolCalled: { name: toolName, args: toolArgs, result: dbData }
      };
    }

      async function callGeminiApi(userQuery, history) {
        const keyToUse = apiKey.trim();
        if (!keyToUse) {
          throw new Error("API key required for Gemini Flash mode.");
        }
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${keyToUse}`;

        const contents = history.map(msg => ({
          role: msg.sender === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        }));

        contents.push({ role: 'user', parts: [{ text: userQuery }] });

        const systemInstruction = await getSystemInstruction();
        const payload = {
          contents: contents,
          tools: [{ functionDeclarations: TOOL_DECLARATIONS }],
          systemInstruction: { parts: [{ text: systemInstruction }] }
        };

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API returned status ${response.status}`);
        }

        const data = await response.json();
        const candidate = data.candidates?.[0];
        const part = candidate?.content?.parts?.[0];

        if (part && part.functionCall) {
          const toolCall = part.functionCall;
          const toolResult = await executeDatabaseTool(toolCall.name, toolCall.args || {});

          setActiveToolInfo({
            name: toolCall.name,
            args: toolCall.args,
            result: toolResult
          });

          const followUpContents = [
            ...contents,
            candidate.content,
            {
              role: 'user',
              parts: [{
                functionResponse: {
                  name: toolCall.name,
                  response: { content: toolResult }
                }
              }]
            }
          ];

          const followUpSystemInstruction = await getSystemInstruction();
          const followUpResponse = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: followUpContents,
              systemInstruction: { parts: [{ text: followUpSystemInstruction }] }
            })
          });

          const followUpData = await followUpResponse.json();
          const finalCandidate = followUpData.candidates?.[0];
          const finalPart = finalCandidate?.content?.parts?.[0];

          return {
            text: finalPart?.text || "Here is the information from our database.",
            toolCalled: { name: toolCall.name, args: toolCall.args, result: toolResult }
          };
        }

        return {
          text: part?.text || "I'm here to help with Riverside Books questions!",
          toolCalled: null
        };
      }

            if (fallbackReply.toolCalled?.name === 'reserve_book_copy' && fallbackReply.toolCalled?.result?.success) {
              setDbReservations(prev => [...prev, fallbackReply.toolCalled.result.reservation_details]);

            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                sender: 'bot',
                text: `*(Notice: Automatically answered via SQLite Local Database Mode)*\n\n${fallbackReply.text}`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                toolInfo: fallbackReply.toolCalled
              }
            ]);
          } catch (fallbackErr) {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                sender: 'bot',
                text: "I experienced a temporary glitch. Please call us directly at (503) 555-0192!",
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }
            ]);

        }

                  <input
